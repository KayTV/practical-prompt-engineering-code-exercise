<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Library</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="container app-header-inner">
        <div>
          <h1 class="title">Prompt Library</h1>
          <p class="subtitle">Save and manage reusable prompts.</p>
        </div>
        <div id="userBar" class="user-bar" style="display:none">
          <span id="userEmail" class="user-email"></span>
          <button id="logoutBtn" class="btn-logout" type="button">Log Out</button>
        </div>
      </div>
    </header>

    <!-- Auth panel (shown when logged out) -->
    <div id="authPanel" class="auth-panel" style="display:none">
      <div class="container">
        <div class="auth-card">
          <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-tab="login">Log In</button>
            <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
          </div>

          <form id="loginForm" class="auth-form">
            <div class="field">
              <label for="loginEmail">Email</label>
              <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" required />
            </div>
            <p id="loginError" class="auth-error"></p>
            <button type="submit" class="btn btn-primary">Log In</button>
          </form>

          <form id="signupForm" class="auth-form" style="display:none">
            <div class="field">
              <label for="signupEmail">Email</label>
              <input id="signupEmail" type="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="signupPassword">Password</label>
              <input id="signupPassword" type="password" placeholder="Min. 6 characters" autocomplete="new-password" required minlength="6" />
            </div>
            <p id="signupError" class="auth-error"></p>
            <button type="submit" class="btn btn-primary">Sign Up</button>
          </form>
        </div>
      </div>
    </div>

    <main class="container" id="appMain" style="display:none">
      <section class="panel" aria-label="Create prompt">
        <form id="promptForm" class="form">
          <div class="field">
            <label for="promptTitle">Title</label>
            <input
              id="promptTitle"
              name="title"
              type="text"
              placeholder="e.g., Summarize an article"
              autocomplete="off"
              required
            />
          </div>

          <div class="field">
            <label for="promptContent">Prompt</label>
            <textarea
              id="promptContent"
              name="content"
              rows="6"
              placeholder="Write your prompt content here..."
              required
            ></textarea>
          </div>

          <div class="field">
            <label for="promptModel">Model (optional)</label>
            <input
              id="promptModel"
              name="model"
              type="text"
              placeholder="e.g., GPT-4, Claude 3.5 Sonnet"
              autocomplete="off"
              maxlength="100"
            />
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">Save prompt</button>
          </div>
        </form>
      </section>

      <section class="section-header" aria-label="Saved prompts">
        <div class="section-header-left">
          <h2 class="section-title">Saved prompts</h2>
          <p id="countText" class="muted" aria-live="polite"></p>
        </div>
        <div class="section-header-right">
          <button id="exportBtn" class="btn-import-export" type="button" aria-label="Export library">
            📤 Export
          </button>
          <button id="importBtn" class="btn-import-export" type="button" aria-label="Import library">
            📥 Import
          </button>
        </div>
      </section>

      <section id="cards" class="cards" aria-live="polite"></section>
    </main>

    <footer class="footer">
      <div class="container muted">
        Stored in <a href="https://neon.tech" target="_blank" rel="noopener">Neon</a> Postgres.
      </div>
    </footer>

    <script src="./app.js" defer></script>
  </body>
</html>
